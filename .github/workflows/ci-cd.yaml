name: Java CI Pipeline

on:
  push:
    branches: 
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2

    - name: Set up Java
      uses: actions/setup-java@v4.7.0.
      

    - name: Run Custom Action
      uses: ./.github/actions/java-build
      with:
        file-name: Main
